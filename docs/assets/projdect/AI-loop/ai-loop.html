<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ループエンジニアリング — 体制イメージ（Light / plan-4）</title>
<!-- ------------------------------------------------------------------
     plan-4-timeline.html の第4世代（NEXT）ブロックに差し込むコンパクト図版。
     配色は docs/design-system/light/tokens.css のアンバー（--p3 = #f59e0b）系。
     ループを AI 側が閉じ、人はループの外に出るのが AI-driven 版との違い。
     ------------------------------------------------------------------ -->
<style>
  html,body{margin:0;padding:0;background:transparent}
  svg{display:block}
</style>
</head>
<body>
<svg width="520" height="172" viewBox="0 0 520 172" xmlns="http://www.w3.org/2000/svg"
     style="font-family:'Helvetica Neue','Hiragino Sans','Noto Sans JP','Yu Gothic UI',sans-serif;font-feature-settings:'palt' 1">
  <defs>
    <g id="person">
      <circle cx="0" cy="-8" r="6.2"/>
      <path d="M-9.5,9 a9.5,9.5 0 0 1 19,0 z"/>
    </g>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- ===== 左：アーキテクトは仕様を入れるだけ ===== -->
  <use href="#person" x="52" y="42" fill="#f59e0b"/>
  <text x="52" y="70" text-anchor="middle" font-size="11" font-weight="800" fill="#0d0b1f">アーキテクト</text>
  <rect x="34" y="78" width="36" height="19" rx="9.5" fill="#ffffff" stroke="#f59e0b" stroke-opacity=".4"/>
  <text x="52" y="91.5" text-anchor="middle" font-size="10" font-weight="800" fill="#a35f06">少数</text>

  <!-- 入口はループの先頭「計画AI」 -->
  <path d="M84,44 C150,22 235,16 331,26" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ar3)"/>
  <text x="205" y="56" text-anchor="middle" font-size="11" font-weight="800" fill="#a35f06">仕様を入力</text>

  <!-- ===== 人の関与はループの外側 ===== -->
  <rect x="16" y="106" width="182" height="54" rx="12" fill="none" stroke="#f59e0b" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="32" y="128" font-size="12" font-weight="800" fill="#0d0b1f">人が関与するのは</text>
  <text x="32" y="147" font-size="12" font-weight="800" fill="#0d0b1f">終了条件と逸脱時だけ</text>

  <!-- ===== 右：役割を持ったAIエージェントの自律ループ ===== -->
  <circle cx="360" cy="86" r="28" fill="none" stroke="#f59e0b" stroke-opacity=".55" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="#f59e0b">
    <path d="M-4.5,-4.5 L4.5,0 L-4.5,4.5 z" transform="translate(379.8,105.8) rotate(135)"/>
    <path d="M-4.5,-4.5 L4.5,0 L-4.5,4.5 z" transform="translate(340.2,105.8) rotate(225)"/>
    <path d="M-4.5,-4.5 L4.5,0 L-4.5,4.5 z" transform="translate(340.2,66.2) rotate(315)"/>
    <path d="M-4.5,-4.5 L4.5,0 L-4.5,4.5 z" transform="translate(379.8,66.2) rotate(45)"/>
  </g>
  <text x="360" y="83" text-anchor="middle" font-size="12" font-weight="900" fill="#a35f06">自律</text>
  <text x="360" y="97" text-anchor="middle" font-size="10" font-weight="800" fill="#5b5776">ループ</text>

  <!-- 4つの役割エージェント（正円。リング中心から 57px の位置に等間隔で置く） -->
  <circle cx="360" cy="29"  r="22" fill="#ffffff" stroke="#f59e0b" stroke-opacity=".45"/>
  <text x="360" y="28" text-anchor="middle" font-size="12" font-weight="800" fill="#a35f06">計画</text>
  <text x="360" y="40" text-anchor="middle" font-size="9" font-weight="800" fill="#c98a24">AI</text>

  <circle cx="417" cy="86"  r="22" fill="#ffffff" stroke="#f59e0b" stroke-opacity=".45"/>
  <text x="417" y="85" text-anchor="middle" font-size="12" font-weight="800" fill="#a35f06">実装</text>
  <text x="417" y="97" text-anchor="middle" font-size="9" font-weight="800" fill="#c98a24">AI</text>

  <circle cx="360" cy="143" r="22" fill="#ffffff" stroke="#f59e0b" stroke-opacity=".45"/>
  <text x="360" y="142" text-anchor="middle" font-size="12" font-weight="800" fill="#a35f06">検証</text>
  <text x="360" y="154" text-anchor="middle" font-size="9" font-weight="800" fill="#c98a24">AI</text>

  <circle cx="303" cy="86"  r="22" fill="#ffffff" stroke="#f59e0b" stroke-opacity=".45"/>
  <text x="303" y="85" text-anchor="middle" font-size="12" font-weight="800" fill="#a35f06">修正</text>
  <text x="303" y="97" text-anchor="middle" font-size="9" font-weight="800" fill="#c98a24">AI</text>
</svg>
</body>
</html>
